<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Icon sprite: every symbol is a 24x24 outline drawn with currentColor so it follows the theme -->

  <!-- Brand mark: clipboard with a medical cross (pre-screening form) -->
  <symbol id="brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="4.5" width="14" height="16.5" rx="2.5"/>
    <path d="M9 4.5V3.75A.75.75 0 0 1 9.75 3h4.5a.75.75 0 0 1 .75.75v.75"/>
    <path d="M12 9.5v6M9 12.5h6"/>
  </symbol>

  <!-- Search magnifier -->
  <symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="6.5"/>
    <path d="M20 20l-4.2-4.2"/>
  </symbol>

  <!-- Close / clear cross -->
  <symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
  </symbol>

  <!-- Copy to clipboard -->
  <symbol id="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="11" height="11" rx="2"/>
    <path d="M15 5.5V5a1 1 0 0 0-1-1H6a2 2 0 0 0-2 2v8a1 1 0 0 0 1 1h.5"/>
  </symbol>

  <!-- Phone handset (dial) -->
  <symbol id="phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.6 3.5h2.2l1.5 4-2 1.3a11 11 0 0 0 6.9 6.9l1.3-2 4 1.5v2.2a2 2 0 0 1-2.1 2A16.5 16.5 0 0 1 4.6 5.6a2 2 0 0 1 2-2.1z"/>
  </symbol>

  <!-- Chevrons -->
  <symbol id="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 10l5 5 5-5"/>
  </symbol>
  <symbol id="chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 6.5L9 12l5.5 5.5"/>
  </symbol>
  <symbol id="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 6.5L15 12l-5.5 5.5"/>
  </symbol>

  <!-- Theme icons: sun (light), moon (dark), monitor (follow system) -->
  <symbol id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>
  </symbol>
  <symbol id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 14.2A8 8 0 0 1 9.8 4a8 8 0 1 0 10.2 10.2z"/>
  </symbol>
  <symbol id="monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="12" rx="2"/>
    <path d="M8.5 20h7M12 16v4"/>
  </symbol>

  <!-- Filter sliders (opens the date/age sheet on mobile) -->
  <symbol id="sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
    <circle cx="15" cy="7" r="2"/>
    <circle cx="9" cy="17" r="2"/>
  </symbol>

  <!-- Check mark (selected option) -->
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 12.5l4 4 9-9"/>
  </symbol>

  <!-- Alert circle (error banner) -->
  <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7.5v5.5M12 16.5v.01"/>
  </symbol>

  <!-- Clock (stale data notice) -->
  <symbol id="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 7.5V12l3 2"/>
  </symbol>

  <!-- Retry arrow -->
  <symbol id="refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/>
    <path d="M19.5 4.5v4h-4"/>
  </symbol>

  <!-- Empty-state illustration: magnifier over a blank sheet -->
  <symbol id="empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h4"/>
    <path d="M8.5 8h6M8.5 11.5h3"/>
    <circle cx="16" cy="15" r="3.5"/>
    <path d="M20.5 19.5l-2-2"/>
  </symbol>

  <!-- Paperclip (row has attachments) -->
  <symbol id="paperclip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 11.5l-7.6 7.6a4.6 4.6 0 0 1-6.5-6.5l7.9-7.9a3.1 3.1 0 0 1 4.4 4.4l-7.9 7.9a1.55 1.55 0 0 1-2.2-2.2l7.3-7.3"/>
  </symbol>

  <!-- External link: box with an outgoing arrow -->
  <symbol id="external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.5 4.5h6v6M19.5 4.5L11 13"/>
    <path d="M17.5 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2h4"/>
  </symbol>

  <!-- Expand corners (open the image full screen) -->
  <symbol id="expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/>
  </symbol>

  <!-- Magnifier with plus (actual-size toggle) -->
  <symbol id="zoom-in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="6.5"/>
    <path d="M20 20l-4.2-4.2M11 8.5v5M8.5 11h5"/>
  </symbol>

  <!-- Picture (image attachment caption) -->
  <symbol id="image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/>
    <circle cx="9" cy="10" r="1.6"/>
    <path d="M20.5 16l-4.5-4.5-8.5 8"/>
  </symbol>

  <!-- Document with folded corner (PDF attachment caption) -->
  <symbol id="file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3.5H7.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/>
    <path d="M14 3.5V8h4.5M9 13h6M9 16.5h4"/>
  </symbol>
</svg>
